<div class="viewer-bar">
  <span class="info">{{info}}</span>
  <span class="tools"><button type="button" id="v-wrap" aria-pressed="false">wrap</button><span class="sep" aria-hidden="true">&middot;</span><button type="button" id="v-copy">copy</button></span>
</div>
<div class="rule" role="separator" aria-hidden="true"></div>
<div id="viewer" data-src="{{src}}" data-enc="{{enc}}" data-lang="{{lang}}" data-deps="{{deps}}" data-root="{{root}}" data-size="{{size}}" data-lines="{{lines}}">
  <noscript><p class="v-status">This viewer needs JavaScript. <a href="{{src}}">Open the raw file</a>.</p></noscript>
</div>
